<div class="flex flex-col gap-8 p-6 max-w-2xl mx-auto">
  <div class="bg-white shadow-lg rounded-xl p-6">
    <h2 class="text-xl font-semibold mb-4">Formulario de Máquina</h2>
    <form [formGroup]="machineForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="name" class="block font-medium">Nombre:</label>
        <input id="name" type="text" formControlName="name" required class="w-full px-4 py-2 border rounded-md focus:ring focus:ring-teal-300" />
      </div>
      <div>
        <label for="type" class="block font-medium">Tipo:</label>
        <input id="type" type="text" formControlName="type" required class="w-full px-4 py-2 border rounded-md focus:ring focus:ring-teal-300" />
      </div>
      <div>
        <label for="status" class="block font-medium">Estado:</label>
        <select id="status" formControlName="status" class="w-full px-4 py-2 border rounded-md focus:ring focus:ring-teal-300">
          <option *ngFor="let option of statusOptions" [value]="option.value">
            {{ option.label }}
          </option>
        </select>
      </div>
      <button type="submit" [disabled]="machineForm.invalid" class="w-full bg-teal-500 text-white py-2 rounded-md hover:bg-teal-600 disabled:bg-gray-300">
        Guardar
      </button>
    </form>
  </div>
