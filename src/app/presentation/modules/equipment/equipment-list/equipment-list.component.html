<div class="container mx-auto p-4">
  <h2 class="text-2xl font-bold mb-4 text-center">Lista de Equipos</h2>

  <div class="overflow-x-auto">
    <table class="min-w-full border border-gray-300 shadow-md rounded-lg">
      <thead class="bg-gray-200">
        <tr>
          <th class="py-2 px-4 border-b text-left">Nombre</th>
          <th class="py-2 px-4 border-b text-left">Categoría</th>
          <th class="py-2 px-4 border-b text-left">Condición</th>
          <th class="py-2 px-4 border-b text-left">Acciones</th> <!-- Nueva columna para los botones -->
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let equipment of equipmentList" class="hover:bg-gray-100">
          <td class="py-2 px-4 border-b">{{ equipment.cname }}</td>
          <td class="py-2 px-4 border-b">{{ equipment.category }}</td>
          <td class="py-2 px-4 border-b">{{ equipment.ccondition }}</td>
          <td class="py-2 px-4 border-b">
            <button 
              class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
              >Editar</button>
            <button 
              class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 ml-2"
              (click)="deleteEquipment(equipment.id)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
