<div class="flex flex-col gap-8 p-6 max-w-2xl mx-auto">
<div class="bg-white shadow-lg rounded-xl p-6">
  <h2 class="text-xl font-semibold mb-4">Formulario de Equipo</h2>
  <form [formGroup]="equipmentForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <div>
      <label class="block font-medium">Nombre:</label>
      <input type="text" formControlName="name" class="w-full px-4 py-2 border rounded-md focus:ring focus:ring-teal-300" />
    </div>
    <div>
      <label class="block font-medium">Categoría:</label>
      <input type="text" formControlName="category" class="w-full px-4 py-2 border rounded-md focus:ring focus:ring-teal-300" />
    </div>
    <div>
      <label class="block font-medium">Condición:</label>
      <select formControlName="condition" class="w-full px-4 py-2 border rounded-md focus:ring focus:ring-teal-300">
        <option *ngFor="let option of conditionOptions" [value]="option.value">
          {{ option.label }}
        </option>
      </select>
    </div>
    <button type="submit" [disabled]="equipmentForm.invalid" class="w-full bg-teal-500 text-white py-2 rounded-md hover:bg-teal-600 disabled:bg-gray-300">
      Guardar
    </button>
  </form>
</div>
</div>
